<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratório de Regex</title>
    <style>
       
    </style>
</head>

<body>
    <div class="card">
        <h1>Laboratório de Regex</h1>
        <p class="sub">Digite nos campos abaixo para testar 5 validações diferentes em tempo real.</p>

        <div class="grupo">
            <label for="email">1. E-mail (Ex: teste@email.com)</label>
            <input type="text" id="email" placeholder="Digite um e-mail...">
        </div>
        <div class="grupo">
            <label for="cep">2. CEP (Formato: 00000-000)</label>
            <input type="text" id="cep" placeholder="00000-000">
        </div>
        <div class="grupo">
            <label for="celular">3. Celular (Formato: (00) 00000-0000)</label>
            <input type="text" id="celular" placeholder="(11) 98888-7777">
        </div>
        <div class="grupo">
            <label for="numeros">4. Apenas Números (Ex: 12345)</label>
            <input type="text" id="numeros" placeholder="Digite apenas números...">
        </div>
        <div class="grupo">
            <label for="nome">5. Nome (Apenas letras e espaços)</label>
            <input type="text" id="nome" placeholder="Seu nome completo...">
        </div>
    </div>

</body>

</html>
